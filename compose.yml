services:
  mongodb:
    image: mongo:7.0
    container_name: saas_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config/database.config.json:/app/config/database.config.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DB_CONFIG_PATH=/app/config/database.config.json

volumes:
  mongodb_data: